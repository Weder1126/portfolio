<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects</title>
    <link rel="stylesheet" href="../style.css" />
    <script type="module" src="../global.js"></script>
    <script type="module" src="projects.js"></script>
  </head>
  <body>
    <h1 class="projects-title">Projects</h1>

    <div class="pie-container">
      <svg id="projects-pie-plot" viewBox="-50 -50 100 100" role="group" aria-label="Pie chart of projects per year. Click a slice to filter by year."></svg>
      <ul class="legend"></ul>
    </div>

    <input
      class="searchBar"
      type="search"
      aria-label="Search projects"
      placeholder="🔍 Search projects…"
    />

    <div class="projects">
      <!-- Filled in by projects.js from lib/projects.json -->
    </div>
  </body>
</html>
