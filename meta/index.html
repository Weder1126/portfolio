<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meta</title>
    <link rel="stylesheet" href="../style.css" />
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <h1>Meta</h1>
    <p>This page includes stats about the code of this website.</p>

    <!-- Lab 8, Step 1.1: timeline slider -->
    <div id="commit-filter">
      <label>
        Show commits until:
        <input type="range" id="commit-progress" min="0" max="100" value="100" />
        <time id="commit-max-time"></time>
      </label>
    </div>

    <section id="stats">
      <h2>Summary</h2>
      <!-- Filled in by main.js -->
    </section>

    <!-- Lab 8, Step 3: scrollytelling, commits over time -->
    <h2>Commits by time of day</h2>
    <div id="scrolly-1">
      <div id="scatter-story"></div>
      <div id="scatter-plot">
        <div id="chart"></div>
        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
      </div>
    </div>

    <!-- Lab 8, Step 2 + 4: unit visualization of file sizes, one dot per line -->
    <h2>Codebase evolution</h2>
    <div id="scrolly-2">
      <dl id="files">
        <!-- Filled in by files.js:
          <div>
            <dt><code>file name</code><small>N lines</small></dt>
            <dd><div class="loc"></div>...</dd>
          </div>
        -->
      </dl>
      <div id="files-story"></div>
    </div>

    <dl id="commit-tooltip" class="info tooltip" hidden>
      <dt>Commit</dt>
      <dd><a href="" id="commit-link" target="_blank"></a></dd>

      <dt>Date</dt>
      <dd id="commit-date"></dd>

      <dt>Time</dt>
      <dd id="commit-time"></dd>

      <dt>Author</dt>
      <dd id="commit-author"></dd>

      <dt>Lines edited</dt>
      <dd id="commit-lines"></dd>
    </dl>
  </body>
</html>
